[package]
name = "meridian-compliance"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Institutional Compliance & KYC Verification Gate for Meridian Protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
