[package]
name = "meridian-router"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Core Intent & Cross-Chain Router for Meridian Protocol on Stellar Soroban"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
