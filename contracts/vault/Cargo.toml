[package]
name = "meridian-vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "USDC share vault for Meridian Protocol (router-only deposits, manager-distributed yield)"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
