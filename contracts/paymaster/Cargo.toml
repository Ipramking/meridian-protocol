[package]
name = "meridian-paymaster"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Fee accounting and USDC->XLM reserve rebalancing for Meridian Protocol"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
