name: SDK & Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: TypeScript Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and test SDK
        run: npm run test --workspace=@meridian-protocol/sdk

      - name: Build Relayer
        run: npm run build --workspace=@meridian-protocol/relayer

      - name: Build Web App
        run: npm run build --workspace=@meridian-protocol/web
